[project]
name = "edgeops-ai-service"
version = "0.1.0"
description = "Anomaly Detection Service for EdgeOps"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "onnxruntime>=1.31.0",
]

[dependency-groups]
dev = [
    "joblib",
    "mypy>=2.4.0",
    "onnx>=1.23.2",
    "pytest",
    "ruff",
    "scikit-learn",
    "skl2onnx>=1.20.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
edgeops-train = "edgeops_ai.training.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edgeops_ai"]

[tool.pytest.ini_options]
pythonpath = [".","src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # bugbear (likely bugs)
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
]

[tool.ruff.format]

[[tool.mypy.overrides]]
module = ["joblib", "onnxruntime", "sklearn.*", "skl2onnx.*"]
ignore_missing_imports = true
