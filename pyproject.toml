[project]
name = "edgeops-ai-service"
version = "0.1.0"
description = "Anomaly Detection Service for EdgeOps"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn", "pydantic", "pydantic-settings", "httpx", "scikit-learn", "joblib"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest",
    "ruff",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgeops_ai"]

[tool.pytest.ini_options]
pythonpath = [".","src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # bugbear (likely bugs)
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
]

[tool.ruff.format]

[[tool.mypy.overrides]]
module = ["joblib"]
ignore_missing_imports = true
