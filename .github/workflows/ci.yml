name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t edgeops-ai-service .
      - name: Smoke test /health
        run: |
          docker run -d --name ai -p 8080:8080 -e COLLECTOR_POLLING_ENABLED=false edgeops-ai-service
          for _ in $(seq 30); do curl -fs http://localhost:8080/health && break; sleep 1; done
          curl -fs http://localhost:8080/health | grep '"prediction_backend":"rules"'
      - if: failure()
        run: docker logs ai
