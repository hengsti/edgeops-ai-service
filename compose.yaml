services:
  edgeops-ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: edgeops-ai-service:0.1.0
    container_name: edgeops-ai-service
    restart: unless-stopped
    # Optional: every setting has a default (see .env.example); COLLECTOR_API_KEY belongs here.
    env_file:
      - path: .env
        required: false
    environment:
      # Compose service discovery replaces the development localhost default.
      COLLECTOR_BASE_URL: ${COLLECTOR_BASE_URL:-http://edgeops-collector:8095}
    expose:
      - "8080"
    # Health check: image HEALTHCHECK on /health (Dockerfile).
